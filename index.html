<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daily Oil Rates</title>
  
  <!-- Standalone Android App Settings (PWA Mode - Hides browser address bar) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Inline Web App Manifest with App Icons for direct Android installation -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Daily%20Oil%20Rates%22%2C%22short_name%22%3A%22Oil%20Rates%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F2965%2F2965300.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F2965%2F2965300.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

  <!-- Gujarati & Latin Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-gujarati {
      font-family: 'Anek Gujarati', sans-serif;
    }
    .font-num {
      font-family: 'JetBrains Mono', monospace;
    }
    .pb-safe {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6.2rem);
    }
    .pt-safe {
      padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
    }
    .btn-press:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950 antialiased">

  <!-- Top App Bar -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 pt-safe px-4 pb-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950 font-black text-xl">
          🛢️
        </div>
        <div>
          <h1 class="text-base font-extrabold text-white tracking-tight leading-tight">Daily Oil Rates</h1>
          <p class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Zero Storage • Clean Memory
          </p>
        </div>
      </div>

      <!-- Reset Button -->
      <button onclick="resetToLaxmiDepoDefaults()" title="Reset to default values" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 transition flex items-center gap-1 btn-press">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <!-- Main Scrollable App Container -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 py-4 space-y-4 pb-safe">

    <!-- Card 1: Business Details -->
    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800/70 pb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Business Details</span>
        <span class="text-[10px] bg-slate-800 text-amber-400 font-semibold px-2 py-0.5 rounded-md">Defaults to Laxmi Oil Depo</span>
      </div>

      <div class="space-y-2.5">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Firm / Shop Name & City</label>
          <input type="text" id="firm-name" value="Laxmi Oil Depo, Bhavnagar city" placeholder="Shop name & City" oninput="updateLivePreview()" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm font-semibold text-white placeholder-slate-600 focus:outline-none focus:border-amber-400 transition">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-medium text-slate-400">Today's Date</label>
            <span id="date-gujarati-badge" class="text-[11px] font-gujarati text-amber-300 font-bold"></span>
          </div>
          <input type="date" id="rate-date" onchange="onDateChanged()" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs font-semibold font-num text-white focus:outline-none focus:border-amber-400 transition">
        </div>
      </div>
    </div>

    <!-- Card 2: Oil Products & Rates List -->
    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800/70 pb-2.5">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Today's Oil Tin Rates</h2>
          <p class="text-[11px] text-slate-400">Check (✓) to include & enter rate</p>
        </div>
        <button onclick="openAddItemModal()" class="px-2.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold rounded-xl flex items-center gap-1 shadow-sm btn-press transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          <span>Add Oil</span>
        </button>
      </div>

      <!-- In-Memory Dynamic Products Container -->
      <div id="product-rows-container" class="space-y-2.5">
        <!-- Rendered dynamically by script -->
      </div>
    </div>

    <!-- Card 3: Direct Phone & Live Gujarati Preview -->
    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-xl space-y-3">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Direct WhatsApp Number (Optional)</label>
        <div class="flex items-center space-x-2">
          <div class="relative flex-1">
            <span class="absolute left-3.5 top-2.5 text-xs font-bold text-slate-500 font-num">+91</span>
            <input type="tel" id="direct-phone-input" maxlength="10" placeholder="10-digit mobile number" class="w-full pl-11 pr-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold font-num text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
          </div>
          <button onclick="sendToSpecificNumber()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-md btn-press transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            <span>Send</span>
          </button>
        </div>
      </div>

      <div class="pt-3 border-t border-slate-800/80">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Live Gujarati Message</span>
          <span class="text-[10px] text-emerald-400 font-semibold bg-emerald-950/60 border border-emerald-800/60 px-2 py-0.5 rounded">Auto Generated</span>
        </div>
        
        <!-- WhatsApp Chat Style Bubble -->
        <div class="bg-[#121b22] border border-[#233138] rounded-xl p-3 shadow-inner">
          <div id="gujarati-whatsapp-preview" class="font-gujarati text-[13px] leading-relaxed text-slate-200 whitespace-pre-wrap select-text selection:bg-emerald-500 selection:text-black">
            <!-- Populated via script -->
          </div>
          <div class="flex items-center justify-end gap-1 mt-2 text-[10px] text-slate-500">
            <span>Ready for WhatsApp</span>
            <span class="text-emerald-400">✓✓</span>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Fixed Mobile Bottom Bar -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800/90 z-40 px-4 py-3 shadow-2xl">
    <div class="max-w-md mx-auto grid grid-cols-3 gap-2.5">
      
      <!-- Copy Button -->
      <button onclick="copyGeneratedMessage()" class="btn-press bg-slate-800 hover:bg-slate-700 text-slate-200 py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border border-slate-700 transition">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        <span>Copy</span>
      </button>

      <!-- Primary WhatsApp Button with Official SVG Icon -->
      <button onclick="shareWhatsAppGeneral()" class="btn-press col-span-2 bg-[#25D366] hover:bg-[#20bd5a] text-slate-950 py-3 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.969.584 1.948.917 2.796.917 3.182 0 5.768-2.587 5.769-5.766.001-3.181-2.585-5.767-5.769-5.767zm0 10.375c-.759 0-1.637-.249-2.327-.67l-.167-.101-1.728.453.461-1.684-.11-.175c-.477-.756-.73-1.642-.729-2.531.001-2.539 2.067-4.605 4.606-4.605 2.54 0 4.607 2.066 4.607 4.605-.001 2.54-2.068 4.607-4.606 4.607zm8.469-4.875C20.5 5.568 15.932 1 10.5 1 5.068 1 .5 5.568.5 11.672c0 2.073.568 4.025 1.573 5.719L0 23l5.811-2.036a10.426 10.426 0 004.689 1.108c5.432 0 10-4.568 10-10.400z"/>
        </svg>
        <span>Send on WhatsApp</span>
      </button>

    </div>
  </nav>

  <!-- MODAL: ADD EXTRA PRODUCT -->
  <div id="modal-add-item" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 rounded-t-3xl sm:rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4 border border-slate-800">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <h3 class="font-bold text-sm text-white">Add New Product</h3>
        <button onclick="closeAddItemModal()" class="text-slate-400 hover:text-white p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Product Name (English)</label>
          <input type="text" id="new-item-eng" placeholder="e.g. Corn Oil 15kg" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Gujarati Label for Message</label>
          <input type="text" id="new-item-guj" placeholder="દા.ત. મકાઈ તેલ (૧૫ કિલો ડબ્બો)" class="font-gujarati w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm font-semibold text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Price (₹)</label>
          <input type="number" id="new-item-rate" placeholder="e.g. 2150" class="font-num w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold text-white focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="closeAddItemModal()" class="flex-1 py-2.5 rounded-xl border border-slate-700 text-xs font-bold text-slate-400">Cancel</button>
        <button onclick="saveNewItemInMemory()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold hover:bg-amber-400 shadow-md">Add Item</button>
      </div>
    </div>
  </div>

  <!-- In-App Notification Toast -->
  <div id="toast-box" class="fixed top-5 inset-x-4 max-w-xs mx-auto z-50 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-2.5 transform -translate-y-16 opacity-0 transition-all duration-300 pointer-events-none">
    <span id="toast-icon">✓</span>
    <span id="toast-text" class="text-xs font-semibold">Done</span>
  </div>

  <script>
    /**
     * ZERO LOCAL STORAGE ARCHITECTURE:
     * No localStorage, no sessionStorage, no database, no cookies.
     * All states live strictly in memory and reset cleanly.
     */
    const DEFAULT_SHOP_NAME = "Laxmi Oil Depo";

    // Base oil catalog with ALL items deselected by default and blank rates
    const defaultProducts = [
      { id: 'p1', eng: 'Groundnut Oil (Sing Tel 15kg)', guj: 'સીંગતેલ (૧૫ કિલો ડબ્બો)', rate: '', active: false },
      { id: 'p2', eng: 'Cottonseed Oil (Kapasiya 15kg)', guj: 'કપાસિયા તેલ (૧૫ કિલો ડબ્બો)', rate: '', active: false },
      { id: 'p3', eng: 'Mustard Oil (Sarson 15kg)', guj: 'સરસવ તેલ (૧૫ કિલો ડબ્બો)', rate: '', active: false },
      { id: 'p4', eng: 'Sunflower Oil (15L Tin)', guj: 'સૂર્યમુખી તેલ (૧૫ લીટર)', rate: '', active: false },
      { id: 'p5', eng: 'Soybean Oil (15kg Tin)', guj: 'સોયાબીન તેલ (૧૫ કિલો ડબ્બો)', rate: '', active: false },
      { id: 'p6', eng: 'Palmolein Oil (15kg Tin)', guj: 'પામોલીન તેલ (૧૫ કિલો ડબ્બો)', rate: '', active: false }
    ];

    const gujaratiMonths = [
      "જાન્યુઆરી", "ફેબ્રુઆરી", "માર્ચ", "એપ્રિલ", "મે", "જૂન",
      "જુલાઈ", "ઓગસ્ટ", "સપ્ટેમ્બર", "ઓક્ટોબર", "નવેમ્બર", "ડિસેમ્બર"
    ];

    const gujaratiDays = [
      "રવિવાર", "સોમવાર", "મંગળવાર", "બુધવાર", "ગુરુવાર", "શુક્રવાર", "શનિવાર"
    ];

    let sessionProducts = JSON.parse(JSON.stringify(defaultProducts));

    function setTodayDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('rate-date').value = `${yyyy}-${mm}-${dd}`;
      refreshDateDisplayBadge(now);
    }

    function refreshDateDisplayBadge(dateObj) {
      const dayName = gujaratiDays[dateObj.getDay()];
      const dayNum = dateObj.getDate();
      const monthName = gujaratiMonths[dateObj.getMonth()];
      const yearNum = dateObj.getFullYear();
      document.getElementById('date-gujarati-badge').textContent = `${dayName}, ${dayNum} ${monthName} ${yearNum}`;
    }

    function onDateChanged() {
      const val = document.getElementById('rate-date').value;
      if (val) {
        const parts = val.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        refreshDateDisplayBadge(d);
      }
      updateLivePreview();
    }

    function init() {
      document.getElementById('firm-name').value = DEFAULT_SHOP_NAME;
      document.getElementById('direct-phone-input').value = '';
      setTodayDate();
      renderProducts();
      updateLivePreview();
    }

    function renderProducts() {
      const container = document.getElementById('product-rows-container');
      container.innerHTML = '';

      sessionProducts.forEach(item => {
        const row = document.createElement('div');
        row.className = `p-3 rounded-xl border flex items-center justify-between gap-3 transition ${
          item.active 
            ? 'bg-slate-900 border-amber-500/60 shadow-md ring-1 ring-amber-500/20' 
            : 'bg-slate-950/40 border-slate-800/80 opacity-60'
        }`;

        row.innerHTML = `
          <div class="flex items-center space-x-3 min-w-0 flex-1">
            <input type="checkbox" 
                   ${item.active ? 'checked' : ''} 
                   onchange="toggleActive('${item.id}', this.checked)"
                   class="w-5 h-5 rounded border-slate-700 bg-slate-900 text-amber-500 focus:ring-0 accent-amber-500 cursor-pointer flex-shrink-0">
            <div class="min-w-0 flex-1 cursor-pointer" onclick="toggleRowCheckbox('${item.id}')">
              <div class="font-bold text-xs text-white truncate">${escapeHTML(item.eng)}</div>
              <div class="font-gujarati text-[11px] text-slate-400 truncate">${escapeHTML(item.guj)}</div>
            </div>
          </div>

          <div class="flex-shrink-0 flex items-center space-x-1.5">
            <div class="relative w-24">
              <span class="absolute left-2.5 top-2 text-xs font-bold text-slate-500">₹</span>
              <input type="number" 
                     id="rate-input-${item.id}"
                     value="${item.rate}" 
                     placeholder="Rate"
                     oninput="updateRate('${item.id}', this.value)"
                     class="w-full pl-6 pr-2 py-1.5 text-right font-bold text-sm font-num bg-slate-950 border border-slate-700 rounded-lg text-amber-300 placeholder-slate-600 focus:outline-none focus:border-amber-400">
            </div>

            <button onclick="deleteProduct('${item.id}')" title="Remove" class="text-slate-600 hover:text-rose-400 p-1 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function toggleRowCheckbox(id) {
      const p = sessionProducts.find(x => x.id === id);
      if (p) {
        toggleActive(id, !p.active);
      }
    }

    function toggleActive(id, state) {
      const p = sessionProducts.find(x => x.id === id);
      if (p) {
        p.active = state;
        renderProducts();
        updateLivePreview();
        if (state) {
          setTimeout(() => {
            const input = document.getElementById(`rate-input-${id}`);
            if (input) input.focus();
          }, 50);
        }
      }
    }

    function updateRate(id, val) {
      const p = sessionProducts.find(x => x.id === id);
      if (p) {
        p.rate = val;
        // Auto-check if price was typed
        if (val && !p.active) {
          p.active = true;
          renderProducts();
        }
        updateLivePreview();
      }
    }

    function deleteProduct(id) {
      sessionProducts = sessionProducts.filter(x => x.id !== id);
      renderProducts();
      updateLivePreview();
      showToast('Item removed');
    }

    // Reset button functionality
    function resetToLaxmiDepoDefaults() {
      document.getElementById('firm-name').value = DEFAULT_SHOP_NAME;
      document.getElementById('direct-phone-input').value = '';
      setTodayDate();

      // Reset all items: deselected and rate blank
      sessionProducts = defaultProducts.map(p => ({
        ...p,
        rate: '',
        active: false
      }));

      renderProducts();
      updateLivePreview();
      showToast('Reset to Laxmi Oil Depo');
    }

    // Gujarati formatted message generator
    function buildGujaratiMessage() {
      const firm = document.getElementById('firm-name').value.trim() || DEFAULT_SHOP_NAME;
      const rawDate = document.getElementById('rate-date').value;
      
      let formattedGujDate = '';
      if (rawDate) {
        const parts = rawDate.split('-');
        const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
        const dayName = gujaratiDays[dateObj.getDay()];
        const dayNum = dateObj.getDate();
        const monthName = gujaratiMonths[dateObj.getMonth()];
        const yearNum = dateObj.getFullYear();
        formattedGujDate = `${dayName}, ${dayNum} ${monthName} ${yearNum} (${parts[2]}/${parts[1]}/${parts[0]})`;
      }

      let lines = [];
      lines.push(`🙏 *જય શ્રી કૃષ્ણ / શુભ સવાર* 🙏`);
      lines.push(`🏪 *${firm.toUpperCase()}*`);
      if (formattedGujDate) {
        lines.push(`📅 *તારીખ:* ${formattedGujDate}`);
      }
      lines.push(`━━━━━━━━━━━━━━━━━━━━━`);
      lines.push(`📦 *આજના તેલના તાજા ભાવ:*`);
      lines.push(``);

      let activeCount = 0;
      sessionProducts.forEach((p) => {
        if (p.active && p.rate) {
          activeCount++;
          const numPrice = Number(p.rate).toLocaleString('en-IN');
          lines.push(`*${activeCount}. ${p.guj}*`);
          lines.push(`    👉 *ભાવ: ₹${numPrice}/-*`);
          lines.push(``);
        }
      });

      if (activeCount === 0) {
        lines.push(`_(કોઈ આઇટમ પસંદ કરેલ નથી)_`);
        lines.push(``);
      }

      lines.push(`━━━━━━━━━━━━━━━━━━━━━`);
      lines.push(`⚠️ _નોંધ: બજારની વધઘટ મુજબ ભાવ બદલાઈ શકે છે._`);
      lines.push(`🙏 *આપનો આભાર!*`);

      return lines.join('\n');
    }

    function updateLivePreview() {
      document.getElementById('gujarati-whatsapp-preview').textContent = buildGujaratiMessage();
    }

    // General WhatsApp broadcast
    async function shareWhatsAppGeneral() {
      const text = buildGujaratiMessage();

      if (navigator.share) {
        try {
          await navigator.share({ title: 'Daily Oil Rates', text: text });
          return;
        } catch (e) {}
      }

      const encoded = encodeURIComponent(text);
      window.location.href = `https://api.whatsapp.com/send?text=${encoded}`;
    }

    // Direct WhatsApp to specified 10-digit number
    function sendToSpecificNumber() {
      const phoneInput = document.getElementById('direct-phone-input').value.trim();
      const cleanPhone = phoneInput.replace(/[^0-9]/g, '');

      if (cleanPhone.length < 10) {
        showToast('Enter valid 10-digit phone number', true);
        return;
      }

      const fullNumber = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;
      const text = encodeURIComponent(buildGujaratiMessage());
      window.location.href = `https://api.whatsapp.com/send?phone=${fullNumber}&text=${text}`;
    }

    // Copy to clipboard
    function copyGeneratedMessage() {
      const text = buildGujaratiMessage();
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Gujarati message copied!');
      } catch (e) {
        showToast('Copy failed', true);
      }
      document.body.removeChild(ta);
    }

    // Add extra custom product modal
    function openAddItemModal() {
      document.getElementById('new-item-eng').value = '';
      document.getElementById('new-item-guj').value = '';
      document.getElementById('new-item-rate').value = '';
      document.getElementById('modal-add-item').classList.remove('hidden');
    }

    function closeAddItemModal() {
      document.getElementById('modal-add-item').classList.add('hidden');
    }

    function saveNewItemInMemory() {
      const eng = document.getElementById('new-item-eng').value.trim();
      const guj = document.getElementById('new-item-guj').value.trim() || eng;
      const rate = document.getElementById('new-item-rate').value.trim();

      if (!eng) {
        showToast('Enter item name', true);
        return;
      }

      sessionProducts.push({
        id: 'item_' + Date.now(),
        eng: eng,
        guj: guj,
        rate: rate || '',
        active: rate ? true : false
      });

      renderProducts();
      updateLivePreview();
      closeAddItemModal();
      showToast('Item added');
    }

    function showToast(msg, isError = false) {
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-text');
      const icon = document.getElementById('toast-icon');

      text.textContent = msg;
      icon.textContent = isError ? '⚠️' : '✓';
      box.className = `fixed top-5 inset-x-4 max-w-xs mx-auto z-50 ${isError ? 'bg-rose-900 border-rose-700 text-rose-100' : 'bg-slate-800 border-slate-700 text-white'} px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-2.5 transform translate-y-0 opacity-100 transition-all duration-300 pointer-events-none`;

      setTimeout(() => {
        box.classList.remove('translate-y-0', 'opacity-100');
        box.classList.add('-translate-y-16', 'opacity-0');
      }, 2000);
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
